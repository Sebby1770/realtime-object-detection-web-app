[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-object-detection-web-app"
version = "2.0.0"
description = "FastAPI + WebSocket webcam object detector with YOLOv8 and a mock fallback."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Sebby1770" }]
keywords = ["fastapi", "yolo", "opencv", "websocket", "object-detection"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "opencv-python>=4.9,<5.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
app = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "opencv-python>=4.9,<5.0",
  "numpy>=1.26,<3.0",
  "ultralytics>=8.3,<9.0",
]
dev = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/Sebby1770/realtime-object-detection-web-app"
Repository = "https://github.com/Sebby1770/realtime-object-detection-web-app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
