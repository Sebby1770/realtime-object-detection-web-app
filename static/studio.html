<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detection clean feed</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at 50% 40%, #1a1814, #050505 62%);
        color: #f6f1e8;
        font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: transparent;
      }
      p {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        margin: 0;
        padding: 0.45rem 0.75rem;
        border: 1px solid rgba(226, 177, 90, 0.35);
        border-radius: 999px;
        background: rgba(12, 10, 8, 0.72);
        color: #f0d7a4;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="out"></canvas>
    <p>Clean feed · share this window, or pick OBS Virtual Camera</p>
    <script>
      const canvas = document.querySelector("#out");
      const context = canvas.getContext("2d");
      const channel = new BroadcastChannel("detection-studio");
      channel.onmessage = (event) => {
        const blob = event.data;
        if (!(blob instanceof Blob)) {
          return;
        }
        createImageBitmap(blob).then((bitmap) => {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          context.drawImage(bitmap, 0, 0);
          bitmap.close();
        });
      };
    </script>
  </body>
</html>
